name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6.8.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check src tests examples

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6.8.0

      - name: Audit workflows with zizmor
        run: uvx zizmor .
