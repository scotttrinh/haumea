[project]
name = "haumea"
version = "0.1.0"
description = "A Python framework for seamless serverless usage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
haumea = "haumea.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
# Rebuild when sources change, so apps depending on a local checkout by path
# (like examples/hello) don't vendor a stale cached wheel.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
